<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — TaskFlow</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="login.html" class="brand">
            <span class="brand-icon">TF</span> TaskFlow
        </a>
    </nav>

    <main class="container narrow">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Reset password</h1>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.95rem;">Enter your email to receive recovery instructions</p>
        </div>

        <form id="forgotForm" class="auth-form">
            <div class="form-group">
                <label for="forgotEmail">Account Email</label>
                <input id="forgotEmail" type="email" placeholder="you@company.com" required autofocus autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-size: 0.95rem;">
                Send Reset Link &rarr;
            </button>
        </form>

        <p id="forgotResult" style="margin-top: 1rem; color: var(--text-secondary); text-align: center; font-weight: 500;"></p>

        <p class="auth-switch">
            Remember your credentials? <a href="login.html">Return to log in</a>
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
