<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — TaskFlow</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="login.html" class="brand">
            <span class="brand-icon">TF</span> TaskFlow
        </a>
    </nav>

    <main class="container narrow">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Welcome back</h1>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.95rem;">Log in to access your projects and tasks</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="password">Password</label>
                    <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--accent); text-decoration: none; font-weight: 600;">Forgot password?</a>
                </div>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-size: 0.95rem;">
                Sign In &rarr;
            </button>
        </form>

        <p id="errorBanner" class="error-banner hidden"></p>

        <p class="auth-switch">
            Don't have an account yet? <a href="register.html">Create an account</a>
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
